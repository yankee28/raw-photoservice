<title>Raw Photoservice</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--card:#141824;--line:#4a3f1c;--gold:#d4af37;--gold2:#e5a93b;--txt:#f1ede4;--mut:#9aa0ad;--wa:#25d366;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;min-height:100vh;padding-bottom:110px}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;background:#10141d;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.brand{flex:1;min-width:0}.brand b{font-family:Cinzel,serif;font-weight:600;letter-spacing:.08em;color:var(--gold);font-size:17px;display:block}
.brand small{color:var(--mut);letter-spacing:.14em;font-size:10px}
.lang{display:flex;background:var(--card);border:1px solid #2c3242;border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);font:600 12px Montserrat;padding:7px 11px;border-radius:99px}
.lang button.on{background:var(--gold);color:#111}
.back{width:44px;height:44px;border-radius:50%;border:0;background:#1d2230;color:var(--txt);font-size:20px}
.pt{font-family:Cinzel,serif;color:var(--gold);font-size:20px;flex:1}
main{padding:16px}
.intro{color:var(--mut);font-size:13px;margin:0 2px 14px}.intro b{display:block;color:var(--txt);font-size:16px;font-weight:500;margin-top:2px}
.cat{position:relative;display:block;width:100%;height:170px;border-radius:22px;border:1px solid var(--line);overflow:hidden;margin-bottom:14px;text-align:left;color:var(--txt);padding:0;cursor:pointer;background:var(--card)}
.cat .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.cat .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,14,20,.35),rgba(11,14,20,.88))}
.cat .n{position:absolute;top:14px;left:16px;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;background:rgba(11,14,20,.6)}
.cat .c{position:absolute;top:14px;right:16px;font-size:12px;border-radius:99px;padding:5px 11px;background:rgba(11,14,20,.75)}
.cat .t{position:absolute;left:18px;right:78px;bottom:16px}
.cat h2{font-family:Cinzel,serif;font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.cat p{font-size:12.5px;color:#d3d0c8;margin-top:4px}
.cat .go{position:absolute;right:16px;bottom:16px;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font-size:20px}
.info{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
.info p{font-size:14px}.info ul{margin:8px 0 0 16px;color:var(--mut);font-size:12.5px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{position:relative;aspect-ratio:3/4;border-radius:20px;border:1px solid var(--line);overflow:hidden;background:var(--card);padding:0;color:var(--txt);text-align:left;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;font-size:13.5px;background:linear-gradient(transparent,rgba(11,14,20,.92))}
.wa{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:10px 20px 10px 10px;border-radius:99px;background:#0d1a14;border:1.5px solid var(--wa);color:var(--txt);text-decoration:none;font-weight:500;font-size:15px;z-index:6;box-shadow:0 6px 24px rgba(37,211,102,.18)}
.wa i{width:38px;height:38px;border-radius:50%;background:var(--wa);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
#lb{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#lb.on{display:flex}
#lb img{flex:1;min-height:0;width:100%;object-fit:contain;touch-action:pinch-zoom}
#lb .bar{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-size:14px}
#lb button{border:0;background:#1d2230;color:var(--txt);width:42px;height:42px;border-radius:50%;font-size:18px}
.empty{grid-column:1/-1;color:var(--mut);font-size:13px;text-align:center;padding:30px 10px}
</style></head><body>
<header id="hd"></header><main id="app"></main>
